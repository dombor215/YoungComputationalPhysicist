<title>Mladý počítačový fyzik</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;polygon points='50,6 88,28 88,72 50,94 12,72 12,28' fill='%232196F3'/&gt;&lt;text x='50' y='68' font-family='Arial, sans-serif' font-size='60' font-weight='bold' fill='%23fff' text-anchor='middle'&gt;S&lt;/text&gt;&lt;/svg&gt;">

<style>
  /* ===== Default theme – override any of these in custom.css ===== */
  :root {
    --font: Arial, sans-serif;
    --toc-width: 280px;
    --toc-min-width: 180px;
    --toc-max-width: 640px;

    --toc-bg: #f5f5f5;
    --toc-text: #333;
    --link-bg: #fff;
    --link-text: #333;
    --link-hover-bg: #e0e0e0;
    --accent: #4CAF50;
    --accent-hover: #45a049;
    --accent-text: #fff;
    --section-bg: #333;
    --section-hover-bg: #444;
    --section-text: #fff;
    --divider: #d0d0d0;
    --content-bg: #fff;
    --radius: 5px;
    --anim: .25s;
  }

  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .container { display: flex; height: 100vh; height: 100dvh; position: relative; overflow: hidden; }

  /* ===== TOC panel ===== */
  .toc {
    flex: 0 0 auto; width: var(--toc-width); box-sizing: border-box;
    background: var(--toc-bg); color: var(--toc-text);
    overflow-y: auto; padding: 20px; margin-left: 0;
    transition: margin-left var(--anim) ease, visibility 0s;
  }
  .container.toc-collapsed .toc {
    margin-left: calc(-1 * var(--toc-width));
    visibility: hidden;                       /* removes hidden links from tab order */
    transition: margin-left var(--anim) ease, visibility 0s linear var(--anim);
  }
  .toc h2 { margin: 0 0 12px; cursor: pointer; transition: color .3s; }
  .toc h2:hover { color: var(--accent); }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc li { margin: 5px 0; }
  .toc a {
    display: block; padding: 12px 15px; text-decoration: none;
    color: var(--link-text); background: var(--link-bg);
    border-radius: var(--radius); transition: background .3s;
  }
  .toc a:hover { background: var(--link-hover-bg); }
  .toc a.active { background: var(--accent); color: var(--accent-text); }

  .lang-picker { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; }
  .lang-picker select {
    flex: 1; padding: 6px 8px; font: inherit; cursor: pointer;
    border: 1px solid var(--divider); border-radius: var(--radius);
    background: var(--link-bg); color: var(--link-text);
  }

  .section-header {
    width: 100%; display: flex; align-items: center; padding: 12px 15px; border: 0;
    background: var(--section-bg); color: var(--section-text);
    border-radius: var(--radius); cursor: pointer; text-align: left;
    font: inherit; font-weight: bold; transition: background .3s;
  }
  .section-header:hover { background: var(--section-hover-bg); }
  .section-header .toggle-icon { margin-left: auto; transition: transform .3s; font-size: 18px; }
  .section-header.collapsed .toggle-icon { transform: rotate(-90deg); }

  .subsection {
    display: grid; grid-template-rows: 1fr; margin: 5px 0 0 15px;
    transition: grid-template-rows .3s ease, opacity .3s ease;
  }
  .subsection > ul { min-height: 0; overflow: hidden; }
  .subsection.collapsed { grid-template-rows: 0fr; opacity: 0; }
  .subsection.collapsed > ul { visibility: hidden; transition: visibility 0s linear .3s; }

  /* ===== Divider + toggle tab ===== */
  .resizer {
    position: relative; flex: 0 0 6px; z-index: 10; cursor: col-resize; touch-action: none;
    background: var(--divider); transition: background .2s;
  }
  .resizer::before { content: ""; position: absolute; inset: 0 -4px; }   /* wider grab area */
  .resizer:hover, .resizer:focus-visible, .container.resizing .resizer { background: var(--accent); outline: none; }
  .container.toc-collapsed .resizer { cursor: default; }

  .toc-toggle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 22px; height: 56px; padding: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--divider); border-radius: 11px;
    background: var(--content-bg); color: var(--toc-text);
    box-shadow: 0 1px 4px rgba(0,0,0,.2); cursor: pointer;
    transition: background .2s, color .2s, border-color .2s, left var(--anim), transform var(--anim);
  }
  .toc-toggle:hover, .toc-toggle:focus-visible { background: var(--accent); color: var(--accent-text); border-color: var(--accent); outline: none; }
  .toc-toggle svg { width: 14px; height: 14px; transition: transform var(--anim); }
  .container.toc-collapsed .toc-toggle { left: 0; transform: translate(0, -50%); border-radius: 0 11px 11px 0; border-left: 0; }
  .container.toc-collapsed .toc-toggle svg { transform: rotate(180deg); }

  /* ===== Content: one persistent iframe per page ===== */
  .content { flex: 1 1 0; min-width: 0; position: relative; background: var(--content-bg); }
  .content iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: var(--content-bg); visibility: hidden; pointer-events: none;
  }
  .content iframe.active { visibility: visible; pointer-events: auto; }

  /* ===== While dragging ===== */
  .container.resizing, .container.resizing * { transition: none !important; user-select: none; cursor: col-resize; }
  .container.resizing iframe { pointer-events: none; }

  /* ===== Phones: TOC becomes a drawer ===== */
  @media (max-width: 700px) {
    .container { --toc-width: 82vw; }
    .toc { position: absolute; top: 0; bottom: 0; left: 0; z-index: 20; }
    .container:not(.toc-collapsed) .toc { box-shadow: 2px 0 10px rgba(0,0,0,.25); }
    .resizer { position: absolute; top: 0; bottom: 0; left: var(--toc-width); z-index: 21; cursor: default; transition: left var(--anim) ease; }
    .container.toc-collapsed .resizer { left: 0; }
  }
</style>

<link rel="stylesheet" href="custom.css"> <!-- optional; must come after the defaults -->
<script src="toc.js"></script>
</head>

<body>
<div class="container" id="container">
  <aside class="toc" id="toc"></aside>

  <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" tabindex="0">
    <button class="toc-toggle" id="tocToggle" type="button" aria-controls="toc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  </div>

  <main class="content" id="frames"></main>
</div>

<script>
(() => {
  'use strict';

  /* ---------- config (supports your old `tocData` format too) ---------- */
  let cfg;
  if (typeof bookConfig !== 'undefined') cfg = bookConfig;
  else if (typeof tocData !== 'undefined') cfg = { languages: [Object.assign({ code: 'default', label: 'Default' }, tocData)] };
  else throw new Error('toc.js must define `bookConfig`');

  const settings = Object.assign({
    keepPagesAlive: true,
    maxLivePages: 0,
    injectMathJax: true,
    mathJaxUrl: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js'
  }, cfg.settings);
  const languages = cfg.languages;

  const DEFAULT_UI = {
    language: 'Language', hideToc: 'Hide contents', showToc: 'Show contents', resizeToc: 'Resize panel'
  };

  const LS = { lang: 'book.lang', width: 'book.tocWidth', collapsed: 'book.tocCollapsed' };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };

  /* ---------- elements / state ---------- */
  const root = document.documentElement;
  const container = document.getElementById('container');
  const tocEl = document.getElementById('toc');
  const resizer = document.getElementById('resizer');
  const toggleBtn = document.getElementById('tocToggle');
  const framesEl = document.getElementById('frames');
  const isMobile = window.matchMedia('(max-width: 700px)');

  let currentLang = null;
  let activePath = null;
  let activeItem = null;          // null = home page
  const frames = new Map();       // path -> { el, persist }
  const order = [];               // least → most recently used paths

  const ui = key => (currentLang && currentLang.ui && currentLang.ui[key]) || DEFAULT_UI[key];

  /* ================= TOC ================= */
  function buildTOC() {
    tocEl.replaceChildren();

    const h = document.createElement('h2');
    h.textContent = currentLang.title;
    h.onclick = () => openPage(currentLang.homePage, null);
    tocEl.append(h);

    if (languages.length > 1) {
      const wrap = document.createElement('div');
      wrap.className = 'lang-picker';
      const label = document.createElement('label');
      label.htmlFor = 'langSelect';
      label.textContent = ui('language');
      const select = document.createElement('select');
      select.id = 'langSelect';
      languages.forEach(l => {
        const o = document.createElement('option');
        o.value = l.code;
        o.textContent = l.label || l.code;
        o.selected = l === currentLang;
        select.append(o);
      });
      select.onchange = () => setLanguage(select.value);
      wrap.append(label, select);
      tocEl.append(wrap);
    }

    const ul = document.createElement('ul');
    currentLang.sections.forEach((section, i) => {
      const li = document.createElement('li');

      const header = document.createElement('button');
      header.type = 'button';
      header.className = 'section-header';
      const name = document.createElement('span');
      name.textContent = section.name;
      const icon = document.createElement('span');
      icon.className = 'toggle-icon';
      icon.textContent = '▼';
      header.append(name, icon);

      const sub = document.createElement('div');
      sub.className = 'subsection';
      sub.id = `section-${i}`;
      header.setAttribute('aria-controls', sub.id);

      const setFolded = folded => {
        sub.classList.toggle('collapsed', folded);
        header.classList.toggle('collapsed', folded);
        header.setAttribute('aria-expanded', String(!folded));
      };
      header.onclick = () => setFolded(!sub.classList.contains('collapsed'));

      const inner = document.createElement('ul');
      section.items.forEach(item => {
        const itemLi = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = item.name;
        a.dataset.path = item.path;
        a.onclick = e => {
          e.preventDefault();
          openPage(item.path, item);
          if (isMobile.matches) setCollapsed(true, false);
        };
        itemLi.append(a);
        inner.append(itemLi);
      });
      sub.append(inner);
      li.append(header, sub);
      ul.append(li);
      setFolded(!!section.collapsed);
    });
    tocEl.append(ul);
    highlight();
  }

  function highlight() {
    tocEl.querySelectorAll('a').forEach(a => {
      const on = a.dataset.path === activePath;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  /* ================= Language ================= */
  function findItemById(lang, id) {
    for (const s of lang.sections) for (const it of s.items) if (it.id && it.id === id) return it;
    return null;
  }

  function setLanguage(code) {
    const lang = languages.find(l => l.code === code) || languages[0];
    const prevId = activeItem && activeItem.id;
    currentLang = lang;
    store.set(LS.lang, lang.code);
    root.lang = lang.code;
    document.title = lang.title;
    buildTOC();
    refreshLabels();

    const match = prevId ? findItemById(lang, prevId) : null;
    if (match) openPage(match.path, match);
    else openPage(lang.homePage, null);
  }

  /* ================= Persistent pages ================= */
  function createFrame(path, meta) {
    const el = document.createElement('iframe');
    el.dataset.path = path;
    el.title = (meta && meta.name) || currentLang.title;
    if (/youtube(-nocookie)?\.com|youtu\.be/.test(path)) {
      el.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      el.allowFullscreen = true;
    }
    el.addEventListener('load', () => onFrameLoad(el));
    el.src = path;
    framesEl.append(el);
    const entry = { el, persist: settings.keepPagesAlive && !(meta && meta.persist === false) };
    frames.set(path, entry);
    return entry;
  }

  function dropFrame(path) {
    const e = frames.get(path);
    if (!e) return;
    e.el.remove();
    frames.delete(path);
    const i = order.indexOf(path);
    if (i > -1) order.splice(i, 1);
  }

  function notify(entry, visible) {
    try { entry.el.contentWindow.postMessage({ type: 'book:visibility', visible }, '*'); } catch {}
  }

  function openPage(path, item) {
    if (!path) return;
    const entry = frames.get(path) || createFrame(path, item);

    if (activePath && activePath !== path) {
      const prev = frames.get(activePath);
      if (prev) {
        prev.el.classList.remove('active');
        notify(prev, false);
        if (!prev.persist) dropFrame(activePath);
      }
    }

    entry.el.classList.add('active');
    notify(entry, true);
    activePath = path;
    activeItem = item;

    const i = order.indexOf(path);
    if (i > -1) order.splice(i, 1);
    order.push(path);

    if (settings.maxLivePages > 0) {
      while (order.length > settings.maxLivePages) {
        const oldest = order.find(p => p !== activePath);
        if (!oldest) break;
        dropFrame(oldest);
      }
    }
    highlight();
  }

  function onFrameLoad(el) {
    if (!settings.injectMathJax) return;
    try {                                     // throws for cross-origin pages (e.g. YouTube) → ignored
      const w = el.contentWindow, d = el.contentDocument;
      if (!d || !d.body || w.MathJax) return;
      if (!/\\\(|\\\[|\$\$/.test(d.body.textContent)) return;
      const s = d.createElement('script');
      s.src = settings.mathJaxUrl;
      s.async = true;
      d.head.append(s);
    } catch {}
  }

  /* ================= Collapse + resize ================= */
  const isCollapsed = () => container.classList.contains('toc-collapsed');

  function refreshLabels() {
    const text = isCollapsed() ? ui('showToc') : ui('hideToc');
    toggleBtn.title = text;
    toggleBtn.setAttribute('aria-label', text);
    toggleBtn.setAttribute('aria-expanded', String(!isCollapsed()));
    resizer.setAttribute('aria-label', ui('resizeToc'));
  }

  function setCollapsed(collapsed, save = true) {
    container.classList.toggle('toc-collapsed', collapsed);
    if (save) store.set(LS.collapsed, collapsed ? '1' : '0');
    refreshLabels();
  }

  const cssPx = name => parseFloat(getComputedStyle(root).getPropertyValue(name));

  function setWidth(w, save) {
    const min = cssPx('--toc-min-width') || 160;
    const max = Math.min(cssPx('--toc-max-width') || 640, window.innerWidth * 0.7);
    w = Math.round(Math.min(Math.max(w, min), Math.max(min, max)));
    root.style.setProperty('--toc-width', w + 'px');
    resizer.setAttribute('aria-valuenow', w);
    if (save) store.set(LS.width, w);
  }

  function resetWidth() {
    root.style.removeProperty('--toc-width');   // falls back to CSS / custom.css default
    store.del(LS.width);
  }

  toggleBtn.addEventListener('click', () => setCollapsed(!isCollapsed()));

  resizer.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.toc-toggle') || isCollapsed() || isMobile.matches) return;
    e.preventDefault();
    resizer.setPointerCapture(e.pointerId);
    container.classList.add('resizing');
    const left = container.getBoundingClientRect().left;
    const grab = e.clientX - resizer.getBoundingClientRect().left;
    const move = ev => setWidth(ev.clientX - left - grab, false);
    const up = () => {
      resizer.removeEventListener('pointermove', move);
      resizer.removeEventListener('pointerup', up);
      resizer.removeEventListener('pointercancel', up);
      container.classList.remove('resizing');
      store.set(LS.width, Math.round(tocEl.getBoundingClientRect().width));
    };
    resizer.addEventListener('pointermove', move);
    resizer.addEventListener('pointerup', up);
    resizer.addEventListener('pointercancel', up);
  });

  resizer.addEventListener('dblclick', e => {
    if (!e.target.closest('.toc-toggle') && !isCollapsed()) resetWidth();
  });

  resizer.addEventListener('keydown', e => {
    if (isCollapsed() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault();
    const step = (e.shiftKey ? 60 : 20) * (e.key === 'ArrowLeft' ? -1 : 1);
    setWidth(tocEl.getBoundingClientRect().width + step, true);
  });

  document.addEventListener('keydown', e => {            // Alt+T toggles the TOC
    if (e.altKey && e.code === 'KeyT') { e.preventDefault(); setCollapsed(!isCollapsed()); }
  });

  /* ================= Init ================= */
  const savedW = parseFloat(store.get(LS.width));
  if (savedW) setWidth(savedW, false);
  setCollapsed(isMobile.matches ? true : store.get(LS.collapsed) === '1', false);

  const urlLang = new URLSearchParams(location.search).get('lang');
  const wanted = [urlLang, store.get(LS.lang)].find(c => c && languages.some(l => l.code === c));
  setLanguage(wanted || languages[0].code);        // first in toc.js = default
})();
</script>
