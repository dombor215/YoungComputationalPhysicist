<!DOCTYPE html><html><head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }
        .toc {
            width: 250px;
            min-width: 250px;
            box-sizing: border-box;
            background: #f5f5f5;
            overflow-y: auto;
            padding: 20px;
            transition: margin-left 0.3s ease;
        }
        .toc.hidden {
            margin-left: -250px;
        }
        .toc h2 {
            margin-top: 0;
            color: #333;
            cursor: pointer;
            transition: color 0.3s;
        }
        .toc h2:hover {
            color: #4CAF50;
        }
        .toc ul {
            list-style: none;
            padding: 0;
        }
        .toc li {
            margin: 5px 0;
        }
        .toc a {
            display: block;
            padding: 12px 15px;
            text-decoration: none;
            color: #333;
            background: white;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .toc a:hover {
            background: #e0e0e0;
        }
        .toc a.active {
            background: #4CAF50;
            color: white;
        }
        .section-header {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #333;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s;
            font-weight: bold;
        }
        .section-header:hover {
            background: #444;
        }
        .section-header .toggle-icon {
            margin-left: auto;
            transition: transform 0.3s;
            font-size: 18px;
        }
        .section-header.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }
        .subsection {
            margin-left: 15px;
            margin-top: 5px;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
        }
        .subsection.collapsed {
            max-height: 0;
            opacity: 0;
        }
        .subsection.expanded {
            max-height: 500px;
            opacity: 1;
        }
        .toggle-toc-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            background: #4CAF50;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: background 0.3s, left 0.3s ease, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-toc-btn:hover {
            background: #45a049;
            transform: scale(1.1);
        }
        .toggle-toc-btn:active {
            transform: scale(0.95);
        }
        .toggle-toc-btn.toc-hidden {
            left: 20px;
        }
        .toggle-toc-btn.toc-visible {
            left: 255px;
        }
        .content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        iframe {
            width: 100%;
            flex: 1;
            border: none;
        }
    </style>
    <title>Mladý počítačový fyzik</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;polygon points='50,6 88,28 88,72 50,94 12,72 12,28' fill='%232196F3'/&gt;&lt;text x='50' y='68' font-family='Arial, sans-serif' font-size='60' font-weight='bold' fill='%23fff' text-anchor='middle'&gt;S&lt;/text&gt;&lt;/svg&gt;">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
    <script src="toc.js"></script>
    <script>
    document.getElementById("contentFrame").addEventListener("load", () => {
        const iframe = document.getElementById("contentFrame");
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

        if (iframeDoc && iframeDoc.body && window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise([iframeDoc.body]);
        }
    });
    </script>
</head>

<body>
<div class="container">
    <button class="toggle-toc-btn toc-visible" id="toggleBtn" onclick="toggleTOC()">◀</button>

    <div class="toc" id="toc">
        <!-- TOC will be generated here by JavaScript -->
    </div>

    <div class="content">
        <iframe id="contentFrame" src="pages/00_TOC.html"></iframe>
    </div>
</div>

<script>
    let tocVisible = true;

    // Generate TOC from toc.js data
    function generateTOC() {
        const tocContainer = document.getElementById('toc');
        
        // Create title
        const title = document.createElement('h2');
        title.textContent = tocData.title;
        title.onclick = loadHome;
        tocContainer.appendChild(title);
        
        // Create sections
        const ul = document.createElement('ul');
        
        tocData.sections.forEach((section, sectionIndex) => {
            const sectionId = `section${sectionIndex + 1}`;
            
            // Section header
            const li = document.createElement('li');
            const sectionHeader = document.createElement('div');
            sectionHeader.className = 'section-header';
            sectionHeader.onclick = () => toggleSection(sectionId);
            sectionHeader.innerHTML = `
                <span>${section.name}</span>
                <span class="toggle-icon">▼</span>
            `;
            li.appendChild(sectionHeader);
            
            // Subsection items
            const subsection = document.createElement('ul');
            subsection.className = 'subsection expanded';
            subsection.id = sectionId;
            
            section.items.forEach(item => {
                const itemLi = document.createElement('li');
                const link = document.createElement('a');
                link.href = '#';
                link.textContent = item.name;
                link.dataset.path = item.path;
                link.onclick = (e) => loadPage(item.path, e);
                itemLi.appendChild(link);
                subsection.appendChild(itemLi);
            });
            
            li.appendChild(subsection);
            ul.appendChild(li);
        });
        
        tocContainer.appendChild(ul);
    }

    function toggleTOC() {
        const toc = document.getElementById('toc');
        const toggleBtn = document.getElementById('toggleBtn');

        tocVisible = !tocVisible;

        if (tocVisible) {
            toc.classList.remove('hidden');
            toggleBtn.classList.remove('toc-hidden');
            toggleBtn.classList.add('toc-visible');
            toggleBtn.innerHTML = '◀';
        } else {
            toc.classList.add('hidden');
            toggleBtn.classList.remove('toc-visible');
            toggleBtn.classList.add('toc-hidden');
            toggleBtn.innerHTML = '▶';
        }
    }

    function loadHome() {
        const iframe = document.getElementById('contentFrame');
        iframe.src = tocData.homePage;
        iframe.removeAttribute('allow');
        iframe.removeAttribute('allowfullscreen');

        document.querySelectorAll('.toc a').forEach(link => {
            link.classList.remove('active');
        });
    }

    function loadPage(url, event) {
        event.preventDefault();

        const iframe = document.getElementById('contentFrame');
        iframe.src = url;

        if (url.includes('youtube.com')) {
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
            iframe.setAttribute('allowfullscreen', '');
        } else {
            iframe.removeAttribute('allow');
            iframe.removeAttribute('allowfullscreen');
        }

        document.querySelectorAll('.toc a').forEach(link => {
            link.classList.remove('active');
        });
        event.target.classList.add('active');
    }

    function toggleSection(sectionId) {
        const section = document.getElementById(sectionId);
        const header = section.previousElementSibling;

        section.classList.toggle('collapsed');
        section.classList.toggle('expanded');
        header.classList.toggle('collapsed');
    }

    // Initialize TOC when page loads
    document.addEventListener('DOMContentLoaded', function() {
        generateTOC();
        // Set first link as active
        const firstLink = document.querySelector('.toc a');
        if (firstLink) {
            firstLink.classList.add('active');
        }
    });
</script>



</body></html>
